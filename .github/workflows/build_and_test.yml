name: Build and Test

on:
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".tool-versions"
  push:
    branches:
      - main
      - test/*
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".tool-versions"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: Ruby ${{ matrix.ruby }} on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-14]
        ruby: ["3.4", "4.0"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Verify submodule checkout
        run: |
          set -euo pipefail
          git submodule status --recursive
          for path in submodules/mlx submodules/mlx-onnx submodules/mlx-ruby-examples; do
            git submodule status -- "$path" >/dev/null
          done
      - name: Set Ruby crash report path
        run: echo "RUBY_CRASH_REPORT=${RUNNER_TEMP}/ruby-crash-report.log" >> "$GITHUB_ENV"
      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libopenblas-dev liblapacke-dev

      - name: Install macOS build tools
        if: runner.os == 'macOS'
        run: |
          brew install cmake || true

      - name: Build native extension
        run: |
          cd ext/mlx
          ruby extconf.rb
          make -j2

      - name: Install all test dependencies
        run: bundle exec rake deps
      - name: Run ONNX native smoke gates
        run: |
          bundle exec ruby -Itest test/onnx/integration/extconf_compatibility_guard_test.rb
          bundle exec ruby -Itest test/onnx/bindings/onnx_validation_test.rb
          bundle exec ruby -Itest test/onnx/bindings/onnx_export_contract_boundary_test.rb
      - name: Run Ruby test suite
        env:
          RUBYOPT: -W:deprecated -W:performance
        run: bundle exec rake test:all
      - name: Show Ruby crash report (if present)
        if: always()
        run: |
          if [ -f "${RUBY_CRASH_REPORT}" ]; then
            echo "::group::Ruby crash report"
            cat "${RUBY_CRASH_REPORT}"
            echo "::endgroup::"
          else
            echo "No Ruby crash report emitted."
          fi
