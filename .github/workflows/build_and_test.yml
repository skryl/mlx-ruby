name: Build and Test

on:
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  push:
    branches:
      - main
      - test/*
    paths-ignore:
      - "**/*.md"
      - "docs/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: Ruby ${{ matrix.ruby }} on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-14]
        ruby: ["3.4", "4.0"]
    runs-on: ${{ matrix.os }}
    env:
      RUBY_CRASH_REPORT: ${{ runner.temp }}/ruby-crash-report.log
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libopenblas-dev liblapacke-dev

      - name: Install macOS build tools
        if: runner.os == 'macOS'
        run: |
          brew install cmake || true

      - name: Build native extension
        run: |
          cd ext/mlx
          ruby extconf.rb
          make -j2

      - name: Install dependencies
        run: bundle install
      - name: Run Ruby test suite
        env:
          RUBYOPT: -W:deprecated -W:performance
        run: bundle exec rake test
      - name: Show Ruby crash report (if present)
        if: always()
        run: |
          if [ -f "${RUBY_CRASH_REPORT}" ]; then
            echo "::group::Ruby crash report"
            cat "${RUBY_CRASH_REPORT}"
            echo "::endgroup::"
          else
            echo "No Ruby crash report emitted."
          fi
