<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Latent Drift: CVAE WebGPU Demo</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap");

      :root {
        --bg: #f2ece2;
        --ink: #141414;
        --panel: #fff7eb;
        --line: #2a2a2a;
        --accent: #0e7a5f;
        --accent-soft: #b7f6e6;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Space Grotesk", "Avenir Next", "Segoe UI", sans-serif;
        color: var(--ink);
        background:
          radial-gradient(circle at 10% 10%, #fff7d8 0%, transparent 45%),
          radial-gradient(circle at 85% 10%, #d5ffe6 0%, transparent 50%),
          radial-gradient(circle at 75% 80%, #d9ecff 0%, transparent 40%),
          var(--bg);
      }

      .shell {
        max-width: 1100px;
        margin: 0 auto;
        padding: 28px 20px 44px;
      }

      .title {
        margin: 0;
        font-size: clamp(2rem, 5vw, 3.6rem);
        line-height: 0.95;
        letter-spacing: -0.04em;
      }

      .subtitle {
        margin: 10px 0 18px;
        font-size: 1rem;
        opacity: 0.8;
        max-width: 70ch;
      }

      .badges {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-bottom: 16px;
      }

      .badge {
        font-family: "IBM Plex Mono", "SFMono-Regular", Menlo, monospace;
        font-size: 0.82rem;
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 6px 10px;
        background: #fff;
      }

      .grid {
        display: grid;
        grid-template-columns: 420px 1fr;
        gap: 18px;
      }

      .card {
        border: 1.8px solid var(--line);
        border-radius: 16px;
        background: var(--panel);
        box-shadow: 4px 4px 0 #00000016;
      }

      .viewer {
        padding: 14px;
      }

      canvas {
        width: 100%;
        aspect-ratio: 1 / 1;
        image-rendering: pixelated;
        border: 2px solid var(--line);
        border-radius: 12px;
        background: #000;
      }

      .status {
        margin-top: 10px;
        font-family: "IBM Plex Mono", "SFMono-Regular", Menlo, monospace;
        font-size: 0.82rem;
        display: grid;
        gap: 4px;
      }

      .controls {
        padding: 16px;
      }

      .row {
        margin-bottom: 12px;
      }

      .row label {
        display: flex;
        justify-content: space-between;
        font-family: "IBM Plex Mono", "SFMono-Regular", Menlo, monospace;
        font-size: 0.85rem;
        margin-bottom: 4px;
      }

      input[type="range"] {
        width: 100%;
        accent-color: var(--accent);
      }

      .actions {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        margin-top: 12px;
      }

      button,
      select {
        border: 1.8px solid var(--line);
        border-radius: 10px;
        background: #fff;
        color: var(--ink);
        font-family: "Space Grotesk", sans-serif;
        font-size: 0.92rem;
        padding: 9px 12px;
      }

      button.primary {
        background: var(--accent-soft);
        border-color: var(--accent);
      }

      .error {
        margin-top: 12px;
        border: 2px solid #9b2f2f;
        border-radius: 10px;
        background: #ffdede;
        padding: 10px;
        font-family: "IBM Plex Mono", "SFMono-Regular", Menlo, monospace;
        font-size: 0.82rem;
        white-space: pre-wrap;
        display: none;
      }

      @media (max-width: 900px) {
        .grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <h1 class="title">Latent Drift</h1>
      <p class="subtitle">
        CVAE decoder from the examples suite, exported via GraphIR -> ONNX, running in-browser with ONNX Runtime Web.
      </p>
      <div class="badges">
        <span class="badge">Model: cvae decoder</span>
        <span class="badge" id="badge-weights">Weights: loading...</span>
        <span class="badge" id="badge-provider">Provider: loading...</span>
        <span class="badge" id="badge-timing">Inference: -- ms</span>
      </div>

      <section class="grid">
        <article class="card viewer">
          <canvas id="preview" width="64" height="64"></canvas>
          <div class="status">
            <div id="status-model">Model: loading...</div>
            <div id="status-shape">Output shape: --</div>
          </div>
        </article>

        <article class="card controls">
          <div class="row">
            <label for="preset">
              <span>Preset</span>
              <span id="preset-name">calm</span>
            </label>
            <select id="preset"></select>
          </div>

          <div class="row">
            <label for="z0"><span>z0</span><span id="z0-value">0.00</span></label>
            <input id="z0" type="range" min="-3" max="3" step="0.05" value="0">
          </div>
          <div class="row">
            <label for="z1"><span>z1</span><span id="z1-value">0.00</span></label>
            <input id="z1" type="range" min="-3" max="3" step="0.05" value="0">
          </div>
          <div class="row">
            <label for="z2"><span>z2</span><span id="z2-value">0.00</span></label>
            <input id="z2" type="range" min="-3" max="3" step="0.05" value="0">
          </div>
          <div class="row">
            <label for="z3"><span>z3</span><span id="z3-value">0.00</span></label>
            <input id="z3" type="range" min="-3" max="3" step="0.05" value="0">
          </div>

          <div class="actions">
            <button class="primary" id="randomize" type="button">Randomize Latent</button>
            <button id="reset" type="button">Reset to Calm</button>
          </div>

          <pre class="error" id="error-box"></pre>
        </article>
      </section>
    </main>

    <script type="module" src="./main.js"></script>
  </body>
</html>
